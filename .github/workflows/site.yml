# Publishes web/ to GitHub Pages. Weekly (or "Run workflow" in the Actions tab) it first runs sync.py
# and commits web/cards.js (and new icons) if the card data changed.
name: site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Sync cards
        if: github.event_name != 'push'
        run: |
          python3 sync.py
          git add web/cards.js web/icons
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: sync cards"
            git push
          fi

      # rb.raumi.dev/search/ is the browser; the root only forwards there (room for other pages later)
      - name: Lay out the site
        run: |
          mkdir -p _site
          cp -r web _site/search
          printf '<!DOCTYPE html><meta charset="utf-8"><title>Riftbound</title><meta http-equiv="refresh" content="0; url=search/"><a href="search/">Riftbound card search</a>\n' > _site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
