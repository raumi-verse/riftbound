# Publishes web/ to GitHub Pages. Weekly (or "Run workflow" in the Actions tab) it first runs sync.py
# and commits web/cards.js (and new icons) if the card data changed.
name: site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Sync cards
        if: github.event_name != 'push'
        run: |
          python3 sync.py
          # the scan's art index; without it new cards are still read by their number
          (pip install -q pillow numpy && python3 art.py) || echo "::warning::art.py failed"
          git add web/cards.js web/icons web/art.js
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: sync cards"
            git push
          fi

      # the page's code on the (just synced) card data, and the sync server; a failure stops the deploy
      - name: Test
        run: |
          node --test test/*.test.mjs
          python3 -m unittest discover test

      # the pages at the root; /search/, where they were, leads there (old links, the app installed from there)
      - name: Lay out the site
        run: |
          cp -r web _site
          mkdir -p _site/search
          for p in index decks collection play goldfish login; do cp moved/page.html _site/search/$p.html; done
          cp moved/sw.js _site/search/sw.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # GitHub lists a fresh artifact a moment late; looked for at once it's "0 artifacts"
      - run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v4
